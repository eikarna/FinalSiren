[package]
name = "siren"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.28", features = ["io-util", "rt"] }
serde_json = "1.0"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
worker = "0.6.1"
# Enable default features (std, async-await) on top of what worker pulls in
# with default-features=false, so StreamExt::buffer_unordered is available for
# the bounded-concurrency sweep in src/proxy/health.rs. Cargo unifies with
# worker's 0.3.x requirement.
futures-util = "0.3"
pin-project-lite = "0.2"
uuid = "1.8.0"
bytes = "1.4.0"
aes-gcm = "0.10"
aes = "0.8"
sha2 = "0.10"
md-5 = "0.10"
anyhow = "1.0.86"
reqwest = "0.12.5"
regex = "1.11.1"
once_cell = "1.21.3"
serde = { version = "1.0.164", features = ["derive"] }
# Already used directly in src/lib.rs (spawn_local); made explicit + pinned to
# the versions worker 0.6.x resolves to so Cargo unifies them.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"


[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = true
